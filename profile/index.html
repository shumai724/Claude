<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しゅうまい | 自己紹介</title>
  <style>
    :root {
      --bg: #f3f5f1;
      --card: #ffffff;
      --text: #22302a;
      --muted: #5f6e66;
      --accent: #1f4d3a;
      --accent-soft: #e3ece6;
      --line: #d9e2dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121a16;
        --card: #1a2620;
        --text: #e6ece8;
        --muted: #9fb0a6;
        --accent: #7fb89a;
        --accent-soft: #24362d;
        --line: #2c3d34;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      line-height: 1.8;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    header { text-align: center; margin-bottom: 40px; }
    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #1f4d3a;
      color: #f3f5f1;
      display: grid;
      place-items: center;
      font-size: 44px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.05em; }
    .tagline { margin: 4px 0 0; color: var(--muted); }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--accent);
    }
    p { margin: 0; }
    ul { margin: 0; padding-left: 1.2em; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 0 12px; }
    .facts li, .tags li {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 14px;
      font-size: 14px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
    a { color: var(--accent); }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 32px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">し</div>
      <h1>しゅうまい</h1>
      <p class="tagline">静岡で暮らす駆け出しエンジニア</p>
    </header>

    <section>
      <h2>自己紹介</h2>
      <ul class="facts">
        <li>25歳</li>
        <li>静岡</li>
        <li>駆け出しエンジニア</li>
      </ul>
      <p>はじめまして、しゅうまいです。静岡でエンジニアとしての一歩を踏み出したところです。日々の学びや作ったものを、少しずつここに積み重ねていきます。</p>
    </section>

    <section>
      <h2>好きなこと</h2>
      <ul class="tags">
        <li>音楽</li>
        <li>ゲーム</li>
      </ul>
    </section>

    <section>
      <h2>最近やっていること</h2>
      <p>おいしいもの巡り。気になるお店を見つけては、足を運んでいます。</p>
    </section>

    <section>
      <h2>リンク</h2>
      <ul>
        <li><a href="https://github.com/shumai724">GitHub</a></li>
      </ul>
    </section>

    <footer>Made with Claude Code</footer>
  </main>
</body>
</html>
